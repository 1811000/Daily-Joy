<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add to Calendar · Daily Joy</title>
<style>
  html, body { background: #fff8f0; color: #312642; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  .card { max-width: 340px; width: 100%; }
  .big { font-size: 54px; }
  h1 { font-size: 22px; margin: 10px 0 6px; }
  p { color: #7a6e8e; margin: 0 0 18px; }
  button { font: inherit; font-weight: 800; color: #fff; border: 0; border-radius: 14px; padding: 14px 22px; width: 100%;
           background: linear-gradient(140deg, #ff6384, #ffa743); }
  button:disabled { opacity: .5; }
  button.ghost { background: transparent; color: #7a6e8e; border: 1.5px solid #e6d8cc; }
  button.close { margin-top: 10px; background: #ffede8; color: #312642; }
  [hidden] { display: none !important; }
  @media (prefers-color-scheme: dark) { html, body { background: #151322; color: #f1edfb; } p { color: #aaa2c6; } }
</style>
</head>
<body>
<div class="card">
  <div class="big" id="big">📅</div>
  <h1 id="h">Add to Calendar</h1>
  <p id="p">Tap the button below to add this reminder.</p>
  <button type="button" id="go">Add to Calendar</button>
  <button type="button" id="close" class="close" hidden>Close this page</button>
</div>
<script>
/* Daily Joy opens this page in Safari (the Home Screen app can't hand a calendar file to Safari itself).
   The event travels in the address: cal.html#d=<calendar text>. The button is shown straight away,
   and the calendar file only opens when you tap it. */
(function () {
  var p = document.getElementById('p'), go = document.getElementById('go');
  var m = /[#&]d=([^&]*)/.exec(location.hash), ics = '';
  try { ics = m ? decodeURIComponent(m[1]) : ''; } catch (e) {}
  if (ics.indexOf('BEGIN:VCALENDAR') !== 0) {
    p.textContent = 'Nothing to add. Go back to Daily Joy and tap the calendar button again.';
    go.disabled = true;
    return;
  }

  // Helper that serves the file with the right type (installed by Daily Joy on first use).
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  var tapped = false;
  function showDone() {
    document.getElementById('h').textContent = 'All set! ✅';
    document.getElementById('big').textContent = '🎉';
    p.innerHTML = 'If you tapped <b>Add</b>, the reminder is in your Calendar.<br><br>' +
      'Now go back to <b>Daily Joy</b>: swipe up from the bottom edge and pick it, or tap its Home Screen icon.';
    go.textContent = 'Add it again'; go.className = 'ghost';
    var c = document.getElementById('close'); c.hidden = false;
  }
  // Coming back from the Calendar screen: show the "done" message instead of the same page again.
  function back() { if (tapped) showDone(); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) back(); });
  window.addEventListener('pageshow', back);
  document.getElementById('close').onclick = function () {
    window.close(); // only works when Safari allows it; otherwise the swipe-up tip above is the way back
    setTimeout(function () { p.innerHTML = 'Swipe up from the bottom edge (or tap the Daily Joy icon) to go back to the app.'; }, 300);
  };

  go.onclick = function () {
    tapped = true;
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      location.href = 'reminder.ics?d=' + encodeURIComponent(ics);
    } else {
      // Helper not active yet: open the file directly as a calendar attachment.
      location.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    }
  };
})();
</script>
</body>
</html>
