<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Joy - make alert keys</title>
<style>
  body { font-family: system-ui, Segoe UI, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #222; }
  button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
  textarea { width: 100%; height: 110px; font-family: Consolas, monospace; font-size: 13px; margin: 6px 0 14px; }
  label { font-weight: 600; }
  .warn { background: #fff4d6; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>
<h1>Make alert keys</h1>
<p>Click the button once. The keys are made in this page and are not sent anywhere. Copy both boxes somewhere safe.</p>
<button id="make">Make keys</button>

<p><label>1. Secret key for the Worker (keep private). Save it as the secret <b>VAPID_JWK</b>:</label>
<textarea id="priv" readonly></textarea></p>

<p><label>2. Public key for the app. Paste it into <b>VAPID_PUBLIC</b> in web\app.js:</label>
<textarea id="pub" readonly></textarea></p>

<p class="warn">Keep box 1 private. If it leaks, anyone can send alerts to your phone. Do not paste it into app.js or sw.js.</p>

<script>
document.getElementById('make').onclick = async function () {
  const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
  const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
  const raw = new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey)); // 04 || x || y
  const b64u = function (bytes) { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  document.getElementById('priv').value = JSON.stringify({ kty: jwk.kty, crv: jwk.crv, x: jwk.x, y: jwk.y, d: jwk.d });
  document.getElementById('pub').value = b64u(raw);
};
</script>
</body>
</html>
